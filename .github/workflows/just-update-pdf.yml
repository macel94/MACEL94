name: Update PDF only from current readme

on:
  # Run manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # ── Generate PDF (after SVGs are ready) ──
      - name: Generate PDF from README
        run: ./src/generate_pdf.sh

      # ── Commit all artifacts ──
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md artifacts/
          git diff --cached --quiet || (git commit -m "docs: update pdf only [skip ci]" && git push)
